# Sensitive Variables - Encrypt this file with ansible-vault
pg_superuser: "postgres"
pg_superuser_password: "Welcom3!"
couchdb_admin_user: ""
couchdb_admin_password: ""

# PostgreSQL 14 (roles/postgres14, port 5433) - superuser for the NEW instance.
# Kept in sync with the PG10 password above by default; change independently if needed.
# Jenkins can override both via extra-vars (pg14_superuser / pg14_superuser_password).
pg14_superuser: "postgres"
pg14_superuser_password: "Welcom3!"

# Qdrant (roles/qdrant, port 6333) - API key for the vector database.
# Empty = Qdrant runs without authentication (trusted network only).
# Set a strong value here (or via Jenkins extra-var qdrant_api_key) and use the
# SAME value as QASIP_HUB_QDRANT_API_KEY in the Knowledge Hub backend env.
qdrant_api_key: ""
