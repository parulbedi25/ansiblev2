---
# tasks file for roles/nginx
- name: Ensure temp directory exists
  win_file:
    path: "{{ temp_dir }}"
    state: directory

- name: Ensure Nginx apps directory exists
  win_file:
    path: "{{ nginx_apps_dir }}"
    state: directory

- name: Check if Nginx is already installed
  win_stat:
    path: "{{ nginx_root_path }}\\nginx.exe"
  register: nginx_installed

- name: Check if Nginx ZIP already exists
  win_stat:
    path: "{{ temp_dir }}\\{{ nginx_zip }}"
  register: nginx_zip_exists

- name: Download Nginx {{ nginx_version }} ZIP
  win_get_url:
    url: "{{ nginx_url }}"
    dest: "{{ temp_dir }}\\{{ nginx_zip }}"
  when: not nginx_installed.stat.exists and not nginx_zip_exists.stat.exists

- name: Extract Nginx to temp directory
  win_unzip:
    src: "{{ temp_dir }}\\{{ nginx_zip }}"
    dest: "{{ temp_dir }}"
    creates: "{{ temp_dir }}\\{{ nginx_folder }}"
  when: not nginx_installed.stat.exists

- name: Move Nginx to apps directory
  win_shell: |
    Move-Item -Path "{{ temp_dir }}\\{{ nginx_folder }}" -Destination "{{ nginx_root_path }}" -Force
  when: not nginx_installed.stat.exists

- name: Safely add Nginx directory to system PATH
  win_path:
    elements:
      - "{{ nginx_root_path }}"
    scope: machine
    state: present

- name: Ensure Nginx log directory exists
  win_file:
    path: "{{ nginx_log_dir }}"
    state: directory

- name: Check if Nginx service already exists
  win_service:
    name: "{{ nginx_service_name }}"
  register: nginx_service_check
  failed_when: false

- name: Stop existing Nginx service if running
  win_service:
    name: "{{ nginx_service_name }}"
    state: stopped
  when: nginx_service_check.exists
  failed_when: false

- name: Remove existing Nginx service if exists
  win_command: nssm remove "{{ nginx_service_name }}" confirm
  when: nginx_service_check.exists
  failed_when: false

# Stopping/removing the NSSM service does not guarantee the nginx.exe
# processes are gone (a master can linger while workers drain, or one
# was started outside the service). A leftover master keeps serving
# :6003 with its OLD config and prevents the new master from binding,
# so the run then times out waiting for :8000 while :6003 "works".
# This role owns Nginx on the host, so clear any leftovers.
- name: Ensure no leftover nginx.exe processes remain
  win_shell: |
    $procs = Get-Process -Name nginx -ErrorAction SilentlyContinue
    if ($procs) {
      Write-Host "Stopping $($procs.Count) leftover nginx.exe process(es)..."
      $procs | Stop-Process -Force
      Start-Sleep -Seconds 2
    }
    if (Get-Process -Name nginx -ErrorAction SilentlyContinue) {
      Write-Host "ERROR: nginx.exe processes are still running"
      exit 1
    }
    exit 0
  changed_when: false

- name: Deploy custom nginx.conf from template
  win_template:
    src: nginx.conf.j2
    dest: "{{ nginx_root_path }}\\conf\\nginx.conf"
  notify: restart nginx

# Fail fast HERE if the template rendered a bad config, instead of
# discovering it later as "connection refused" on 6003/8000.
# NOTE (Windows): judge the syntax verdict in stderr, NOT the exit code.
# `nginx -t` also tries to create the shared-memory object
# "nginx_shared_zone"; while an nginx master (ATMS-Nginx, running as
# SYSTEM) is up, that object is owned by SYSTEM and the Ansible user
# gets "CreateFileMapping(...) failed (5: Access is denied)", making
# nginx exit 1 even when it just printed "syntax is ok". Failing on
# rc alone aborted provisioning before the service was (re)started,
# which is why nothing ever listened on :8000.
- name: Validate rendered nginx.conf (nginx -t)
  win_command: "{{ nginx_root_path }}\\nginx.exe -t -p {{ nginx_root_path }}"
  register: nginx_config_test
  changed_when: false
  failed_when: >-
    nginx_config_test.rc != 0 and
    'syntax is ok' not in (nginx_config_test.stderr | default(''))

- name: Note when nginx -t was blocked by the running service (syntax still OK)
  debug:
    msg: >-
      nginx -t exit code was {{ nginx_config_test.rc }} but the config
      syntax is OK. This is the known Windows shared-zone alert
      (CreateFileMapping Access is denied) caused by testing while an
      nginx master is running; it is not a config error.
      Output: {{ nginx_config_test.stderr | default('') }}
  when:
    - nginx_config_test.rc != 0
    - "'syntax is ok' in (nginx_config_test.stderr | default(''))"

# The Knowledge Hub :8000 server block serves from this directory
# (Jenkinsfile-build-knowledgehub-windows publishes the Admin UI dist
# into it). Create it up front so the server root always exists and
# http://localhost:8000/ answers from the first provisioning run
# (403 until the UI is published, instead of nginx erroring on a
# missing root).
- name: Confirm deployed nginx.conf contains the Knowledge Hub :8000 listener
  win_shell: |
    $conf = "{{ nginx_root_path }}\\conf\\nginx.conf"
    if (-not (Select-String -Path $conf -Pattern 'listen\s+8000;' -Quiet)) {
      Write-Host "ERROR: 'listen 8000;' NOT found in $conf - the Knowledge Hub UI server block did not deploy"
      exit 1
    }
    Write-Host "OK: nginx.conf contains 'listen 8000;' (Knowledge Hub Admin UI)"
    if (-not (Select-String -Path $conf -Pattern 'root\s+html/knowledge-hub;' -Quiet)) {
      Write-Host "ERROR: Knowledge Hub UI root 'html/knowledge-hub' NOT found in $conf"
      exit 1
    }
    Write-Host "OK: nginx.conf serves the published Admin UI from html/knowledge-hub on :8000"
    if (-not (Select-String -Path $conf -Pattern 'proxy_pass\s+http://127\.0\.0\.1:8037;' -Quiet)) {
      Write-Host "ERROR: Knowledge Hub backend proxy '127.0.0.1:8037' NOT found in $conf"
      exit 1
    }
    Write-Host "OK: nginx.conf proxies /health and /mcp/ to the backend on 127.0.0.1:8037"
    exit 0
  changed_when: false
  when: knowledge_hub_enabled | bool

# The backend (Knowledge_Hub, :8037) and the Admin UI (Knowledge_Hub_Admin,
# :8000) are separate applications in separate directories. The code is
# already on the machine (Ansible does not create it) - only report if a
# directory is missing; the Knowledge Hub pipeline fails clearly later if
# the code really is absent.
- name: Check the separate Knowledge Hub backend/frontend directories
  win_stat:
    path: "{{ item }}"
  loop:
    - "{{ knowledge_hub_backend_dir | default('D:\\copper-code\\AI-Python\\Knowledge_Hub') }}"
    - "{{ knowledge_hub_frontend_dir | default('D:\\copper-code\\AI-Python\\Knowledge_Hub_Admin') }}"
  register: knowledge_hub_code_dirs
  changed_when: false
  when: knowledge_hub_enabled | bool

- name: Report missing Knowledge Hub code directories (if any)
  debug:
    msg: >-
      WARNING: {{ item.item }} was not found on this machine. The
      Knowledge Hub backend (:8037) and Admin UI (:8000) live in separate
      directories - deploy the code there before running
      Jenkinsfile-build-knowledgehub-windows.
  loop: "{{ knowledge_hub_code_dirs.results | default([]) }}"
  when:
    - knowledge_hub_enabled | bool
    - not (item.stat.exists | default(false))

- name: Ensure Knowledge Hub UI root directory exists
  win_file:
    path: "{{ nginx_root_path }}\\{{ knowledge_hub_root }}"
    state: directory
  when: knowledge_hub_enabled | bool

- name: Install Nginx service using NSSM
  win_command: >
    nssm install "{{ nginx_service_name }}"
    "{{ nginx_root_path }}\\nginx.exe"

- name: Set Nginx service display name
  win_command: nssm set "{{ nginx_service_name }}" DisplayName "{{ nginx_service_display_name }}"

- name: Set Nginx service description
  win_command: nssm set "{{ nginx_service_name }}" Description "{{ nginx_service_description }}"

- name: Set Nginx service working directory
  win_command: nssm set "{{ nginx_service_name }}" AppDirectory "{{ nginx_root_path }}"

- name: Set Nginx service stdout log
  win_command: nssm set "{{ nginx_service_name }}" AppStdout "{{ nginx_log_dir }}\\stdout.log"

- name: Set Nginx service stderr log
  win_command: nssm set "{{ nginx_service_name }}" AppStderr "{{ nginx_log_dir }}\\stderr.log"

- name: Set Nginx log rotation
  win_command: nssm set "{{ nginx_service_name }}" AppRotateFiles 1

- name: Set Nginx log rotation size (10 MB)
  win_command: nssm set "{{ nginx_service_name }}" AppRotateBytes 10485760

- name: Set Nginx service startup type to automatic
  win_command: nssm set "{{ nginx_service_name }}" Start SERVICE_AUTO_START

- name: Configure Nginx service restart on failure
  win_command: nssm set "{{ nginx_service_name }}" AppExit Default Restart

- name: Set Nginx restart delay (10 seconds)
  win_command: nssm set "{{ nginx_service_name }}" AppRestartDelay "{{ nginx_service_restart_delay }}"

- name: Configure Nginx service startup mode (auto)
  win_service:
    name: "{{ nginx_service_name }}"
    start_mode: auto
    state: started

# Do NOT leave the config restart to the handler alone: handlers only
# flush at the end of a FULLY successful play, and many roles run after
# nginx in windows.yml. If a later role fails, the handler never fires
# and the running Nginx keeps the OLD config (e.g. no :8000 server).
# Flushing here applies a changed nginx.conf immediately.
- name: Apply pending Nginx restart now (flush handlers)
  meta: flush_handlers

- name: Check Nginx version
  win_command: nginx -v
  register: nginx_version_output
  changed_when: false
  failed_when: false

- name: Fail if Nginx binary is not available
  fail:
    msg: >
      Nginx is not installed or not available in PATH.
      Please check Nginx installation.
  when: nginx_version_output.rc != 0

- name: Wait for Nginx to start
  win_wait_for:
    port: "{{ nginx_port }}"
    timeout: 30
    delay: 5

- name: Verify Nginx is responding locally
  win_shell: |
    try {
      $response = Invoke-WebRequest -Uri http://127.0.0.1:{{ nginx_port }} -UseBasicParsing -TimeoutSec 5
      if ($response.StatusCode -eq 200) {
        exit 0
      } else {
        exit 1
      }
    } catch {
      exit 1
    }
  register: nginx_check
  changed_when: false
  failed_when: nginx_check.rc != 0

- name: Wait for Knowledge Hub UI listener (port {{ knowledge_hub_listen_port }})
  win_wait_for:
    port: "{{ knowledge_hub_listen_port }}"
    timeout: 30
    delay: 3
  register: knowledge_hub_ui_wait
  ignore_errors: true
  when: knowledge_hub_enabled | bool

# If :8000 never binds, the reason is in the Nginx error log (bind
# failure, another process on the port, bad root path...). Show it in
# the provisioning log instead of leaving only "timeout while waiting".
- name: Show Nginx error log if the UI listener did not start
  win_shell: |
    if (Test-Path "{{ nginx_log_dir }}\\error.log") {
      Get-Content "{{ nginx_log_dir }}\\error.log" -Tail 30
    } else {
      Write-Host "No Nginx error log found at {{ nginx_log_dir }}\\error.log"
    }
    exit 0
  changed_when: false
  failed_when: false
  when:
    - knowledge_hub_enabled | bool
    - knowledge_hub_ui_wait is failed

- name: Fail if Knowledge Hub UI listener did not start
  fail:
    msg: >-
      Nginx is not listening on port {{ knowledge_hub_listen_port }}
      (Knowledge Hub UI). See the Nginx error log output above and
      check on the host: netstat -ano | findstr :{{ knowledge_hub_listen_port }}
      and findstr /N listen {{ nginx_root_path }}\\conf\\nginx.conf
  when:
    - knowledge_hub_enabled | bool
    - knowledge_hub_ui_wait is failed

# NOTE: no HTTP 200 check here on purpose - the admin UI files are only
# published later by Jenkinsfile-build-knowledgehub-windows, so before
# the first deploy this server correctly answers 403/404. What MUST be
# true right after provisioning: http://localhost:8000/ gets an HTTP
# answer at all (any status), instead of "connection refused".
- name: Verify Knowledge Hub UI answers on localhost:{{ knowledge_hub_listen_port }}
  win_shell: |
    try {
      $r = Invoke-WebRequest -Uri http://127.0.0.1:{{ knowledge_hub_listen_port }}/ -UseBasicParsing -TimeoutSec 5
      Write-Host "HTTP $($r.StatusCode) from localhost:{{ knowledge_hub_listen_port }}"
      exit 0
    } catch {
      if ($_.Exception.Response -ne $null) {
        Write-Host "HTTP $([int]$_.Exception.Response.StatusCode) from localhost:{{ knowledge_hub_listen_port }} (expected before the Admin UI is published)"
        exit 0
      }
      Write-Host "No HTTP answer on localhost:{{ knowledge_hub_listen_port }} - $($_.Exception.Message)"
      exit 1
    }
  register: knowledge_hub_ui_check
  changed_when: false
  failed_when: knowledge_hub_ui_check.rc != 0
  when: knowledge_hub_enabled | bool
