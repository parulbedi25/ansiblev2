---
# defaults file for roles/nginx.
nginx_version: "1.8.1"
nginx_folder: "nginx-{{ nginx_version }}"
nginx_zip: "{{ nginx_folder }}.zip"
nginx_url: "http://nginx.org/download/{{ nginx_zip }}"
temp_dir: "D:\\temp"
nginx_apps_dir: "D:\\QASIP\\Apps"
nginx_root_path: "{{ nginx_apps_dir }}\\nginx"
nginx_port: 6003
nginx_log_dir: "{{ nginx_root_path }}\\logs"

# NGINX service configuration (NSSM)
nginx_service_name: "ATMS-Nginx"
nginx_service_display_name: "ATMS Nginx"
nginx_service_description: "ATMS Nginx Reverse Proxy Service"
nginx_service_restart_delay: 10000  # milliseconds (10 seconds)

# Backend API configuration (used in nginx.conf.j2 template)
# Overridden by IP_ADDRESS parameter from Jenkinsfile.provisioning via -e flag
backend_api_host: "{{ ansible_host }}"
backend_api_port: "8080"

# Nginx listen port (used in nginx.conf.j2 template)
nginx_listen_port: "6003"

# Knowledge Hub (added for the Knowledge Hub deployment - the ATMS server
# block above/listening on nginx_listen_port is untouched).
# The backend and the Admin UI are SEPARATE applications in SEPARATE
# directories on the target - do not mix them up:
#   - Backend : knowledge_hub_backend_dir (D:\copper-code\AI-Python\
#     Knowledge_Hub) - a Python/uvicorn app run by the NSSM service
#     QASIP-KnowledgeHub on port 8037. Nginx never serves files from
#     this directory; it only reverse-proxies to it (below).
#   - Frontend: knowledge_hub_frontend_dir (D:\copper-code\AI-Python\
#     Knowledge_Hub_Admin) - built by Jenkinsfile-build-knowledgehub-
#     windows (npm run build -> dist) and the built files are PUBLISHED
#     (copied) into the Nginx root below. Nginx never serves files
#     directly from the frontend source directory either.
#   - Admin UI is served by Nginx on knowledge_hub_listen_port (8000),
#     root = knowledge_hub_root under the Nginx install
#     (D:\QASIP\Apps\nginx\html\knowledge-hub) - the published copy.
#   - /health and /mcp/ on the UI port (8000) are reverse-proxied to
#     the backend at knowledge_hub_backend_host:knowledge_hub_backend_port
#     (127.0.0.1:8037) so browser calls can stay same-origin (SSE at
#     /mcp/stream needs proxy_buffering off).
knowledge_hub_enabled: true
knowledge_hub_listen_port: "8000"
knowledge_hub_server_name: "_"   # answer for localhost and <instance>.qajarvis.com alike
knowledge_hub_root: "html/knowledge-hub"
knowledge_hub_ui_root_path: "{{ nginx_root_path }}\\{{ knowledge_hub_root }}"
knowledge_hub_backend_host: "127.0.0.1"
knowledge_hub_backend_port: "8037"
# Separate application directories on the target (code is already on the
# machine - Ansible does not create or modify these, they are recorded
# here so the layout is explicit and can be checked during provisioning).
knowledge_hub_backend_dir: 'D:\copper-code\AI-Python\Knowledge_Hub'
knowledge_hub_frontend_dir: 'D:\copper-code\AI-Python\Knowledge_Hub_Admin'
knowledge_hub_frontend_dist_dir: 'D:\copper-code\AI-Python\Knowledge_Hub_Admin\dist'
