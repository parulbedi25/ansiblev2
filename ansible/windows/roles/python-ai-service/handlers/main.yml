---
# handlers file for python-ai-service
- name: restart python-ai-service
  win_service:
    name: "{{ service_name }}"
    state: restarted

- name: stop python-ai-service
  win_service:
    name: "{{ service_name }}"
    state: stopped

- name: start python-ai-service
  win_service:
    name: "{{ service_name }}"
    state: started
