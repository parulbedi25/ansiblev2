---
# defaults file for roles/postgres14
# Replica of roles/postgres (PostgreSQL 10), configured for PostgreSQL 18.
# All variables are prefixed pg14_ so they never clash with the pg_* variables
# of the existing PostgreSQL 10 role.
pg14_version: "18.6-5"
pg14_port: "5433"
pg14_superuser: "postgres"
pg14_superuser_password: "Welcom3!"
pg14_db_names:
  - "atms_master"
  - "qasip_hub"
pg14_roles:
  - "admin"
  - "developer"
  - "app"
  - "report"

# Knowledge Hub application database user (used by Alembic + the Hub API).
# The role ensures this LOGIN role exists and has USAGE+CREATE on schema
# public in pg14_hub_db_name - since PostgreSQL 15 the public schema no
# longer grants CREATE to PUBLIC, so without this grant Alembic fails with
# "permission denied for schema public". Set pg14_hub_db_password in
# secrets.yml to also manage the password (it must then match the Jenkins
# credential 'knowledgehub-db-credentials'); leave empty to only ensure
# the role + grants and never touch the password.
pg14_hub_db_name: "qasip_hub"
pg14_hub_db_user: "kh_app"
pg14_hub_db_password: ""
# kh_app is made SUPERUSER on this dedicated PG18 instance - the Hub's
# Alembic migrations create/drop extensions (pgvector is not a trusted
# extension: CREATE EXTENSION needs superuser, and migration 0017's
# DROP EXTENSION needs owner/superuser). Verified manually on
# 10.10.6.116 (ALTER ROLE kh_app SUPERUSER). Set to false only if the
# Hub migrations are changed to never manage extensions.
pg14_hub_db_superuser: true

# pgAdmin - the LATEST standalone pgAdmin 4 from postgresql.org.
# The pgAdmin bundled with old EDB installs crashes with a fatal error, so
# this role installs/upgrades pgAdmin separately to the version below.
# It upgrades any existing pgAdmin 4 on the host (same default install dir)
# and works against BOTH PostgreSQL 10 (5432) and this instance (5433).
pg14_pgadmin_enabled: true
pg14_pgadmin_version: "9.18"
pg14_pgadmin_install_dir: "C:\\Program Files\\pgAdmin 4"

# pgvector (not part of the PostgreSQL 10 role - added for this instance)
pg14_pgvector_enabled: true
pg14_pgvector_version: "0.8.7"
pg14_pgvector_git_url: "https://github.com/pgvector/pgvector.git"
# Full path to vcvars64.bat of Visual Studio Build Tools.
# Leave empty to auto-detect with vswhere.exe. The tools are expected to be
# part of the base Windows image - this role does NOT install them; it only
# locates vcvars64.bat so the pgvector build .bat can load the compiler
# environment before running nmake (the Windows form of make / make install).
pg14_pgvector_vcvars_path: ""
