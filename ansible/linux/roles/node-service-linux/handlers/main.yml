---
# handlers file for node-service-linux
- name: reload systemd
  systemd:
    daemon_reload: yes

- name: restart node-service
  systemd:
    name: "{{ service_name }}"
    state: restarted

- name: stop node-service
  systemd:
    name: "{{ service_name }}"
    state: stopped

- name: start node-service
  systemd:
    name: "{{ service_name }}"
    state: started
