---
- name: Test Git Installation
  hosts: localhost
  remote_user: root
  become: yes

  roles:
    - git-linux

  post_tasks:
    - name: Verify Git is available
      command: git --version
      register: git_check
      changed_when: false

    - name: Display Git version
      debug:
        msg: "Git version: {{ git_check.stdout }}"
