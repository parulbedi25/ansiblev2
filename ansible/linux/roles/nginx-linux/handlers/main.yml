---
# handlers file for roles/nginx-linux
- name: reload systemd
  systemd:
    daemon_reload: yes

- name: restart nginx
  systemd:
    name: nginx
    state: restarted

- name: reload nginx
  systemd:
    name: nginx
    state: reloaded

- name: start nginx
  systemd:
    name: nginx
    state: started
    enabled: yes

- name: stop nginx
  systemd:
    name: nginx
    state: stopped
