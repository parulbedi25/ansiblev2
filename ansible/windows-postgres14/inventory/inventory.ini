# Sample inventory for the standalone PostgreSQL 14 playbook.
# Mirrors ansible/windows/inventory/inventory.ini - the same [windows] group
# name is used, so you can equally point postgres14.yml at the existing
# inventory and skip this file entirely.
[windows]
# ansible_host=<windows-host-or-ip>

[windows:vars]
ansible_connection=winrm
ansible_winrm_transport=basic
ansible_winrm_server_cert_validation=ignore
ansible_port=5985
# ansible_user=<user>
# ansible_password=<password>
